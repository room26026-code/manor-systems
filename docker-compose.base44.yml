# Base44 development environment.
# Runs the cloned source: Next.js dev server for kite-web on host port 3000 (the
# preview entry point) and the Go API from kite-service with live reload (air).
# The frontend talks to the API through a same-origin Next.js rewrite so the
# session cookie stays first-party.

x-api-common: &api-common
  image: base44-kite-api:dev
  build:
    context: .
    dockerfile: .base44/api.Dockerfile
  working_dir: /src/kite-service
  volumes:
    - ./:/src
  env_file:
    - ./.env.base44-defaults
    - /run/base44/app.env
  environment:
    BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    CGO_ENABLED: "0"
    KITE_API__HOST: "0.0.0.0"
    KITE_API__PORT: "8080"
    KITE_API__PUBLIC_BASE_URL: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
    KITE_APP__PUBLIC_BASE_URL: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
    KITE_DATABASE__POSTGRES__HOST: postgres
    KITE_DATABASE__POSTGRES__PORT: "5432"
    KITE_DATABASE__POSTGRES__DB_NAME: kite
    KITE_DATABASE__POSTGRES__USER: postgres
    KITE_DATABASE__POSTGRES__PASSWORD: postgres
    KITE_DATABASE__S3__ENDPOINT: "s3:8333"
    KITE_DATABASE__S3__ACCESS_KEY_ID: kite
    KITE_DATABASE__S3__SECRET_ACCESS_KEY: "1234567890"
    KITE_DATABASE__S3__SECURE: "false"

services:
  postgres:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kite
    volumes:
      - kite-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kite"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for assets and database backups.
  s3:
    image: chrislusf/seaweedfs:latest
    restart: on-failure
    command: ["server", "-s3", "-s3.port=8333", "-volume.max=10"]
    volumes:
      - kite-s3:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/dir/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # One-shot Postgres migration; the API starts only after it succeeds.
  migrate:
    <<: *api-common
    restart: "no"
    command: ["sh", "-ec", "go run . database migrate postgres up"]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

  api:
    <<: *api-common
    restart: on-failure
    command: ["sh", "-ec", "exec air -c /src/.base44/air.toml"]
    ports:
      - "8000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      base44.project: "Kite API"
      base44.kind: "api"
      base44.port: "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/health | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: node:20
    restart: on-failure
    working_dir: /src/kite-web
    volumes:
      - ./:/src
      - kite-web-node-modules:/src/kite-web/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx next dev -p 3000 -H 0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      NEXT_TELEMETRY_DISABLED: "1"
      # Same-origin API: requests go to /v1/* and Next rewrites them to the API
      # service (preview mode only, see kite-web/next.config.mjs).
      NEXT_PUBLIC_API_PUBLIC_BASE_URL: ""
      KITE_API_PROXY_TARGET: "http://api:8080"
    depends_on:
      api:
        condition: service_healthy
    labels:
      base44.project: "Kite Web"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  kite-postgres:
  kite-s3:
  kite-web-node-modules:
